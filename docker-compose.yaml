services:
  db:
    image: ghcr.io/tursodatabase/libsql-server:latest
    command: /bin/sqld --db-path /data/3d1.sqlite --http-listen-addr 0.0.0.0:5000
    volumes:
      - ./data:/data

  ftp:
    image: stilliard/pure-ftpd:hardened
    container_name: 3d1-ftp
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    volumes:
      - ./data/thumbnail:/home/ftpusers
    environment:
      FTP_USER_NAME: $3D1_FTP_USER_NAME
      FTP_USER_PASS: $3D1_FTP_USER_PASS
      FTP_USER_HOME: /home/ftpusers
    restart: unless-stopped

  cdn:
    image: nginx:latest
    container_name: 3d1-cdn
    ports:
      - "7002:80"
    volumes:
      - ./data/thumbnail:/usr/share/nginx/html:ro
    restart: unless-stopped

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: 3d1-scraper
    depends_on:
      - public
    environment:
      # SQL
      3D1_LIBSQL_DATABASE_URL: http://db:5000
      3D1_LIBSQL_DATABASE_AUTH_TOKEN: ""

      # Admin
      3D1_ADMIN_USER_NAME: $3D1_ADMIN_USER_NAME
      3D1_ADMIN_USER_PASS: $3D1_ADMIN_USER_PASS

      # Storage
      3D1_FTP_HOST: $3D1_FTP_HOST
      3D1_FTP_USER_NAME: $3D1_FTP_USER_NAME
      3D1_FTP_USER_PASS: $3D1_FTP_USER_PASS

      # Server
      3D1_PORT: "7001"
    restart: unless-stopped
  public:
    build:
      context: .
      dockerfile: Dockerfile.public
    container_name: 3d1-server
    ports:
      - "7000:7000"
    depends_on:
      - db
    volumes:
      - ./data/thumbnail:/app/data/thumbnail:ro
    environment:
      # SQL
      3D1_LIBSQL_DATABASE_URL: http://db:5000
      3D1_LIBSQL_DATABASE_AUTH_TOKEN: ""

      # Server
      3D1_PORT: "7000"

      # CDN
      3D1_CDN_URL: http://localhost:7002
    restart: unless-stopped
